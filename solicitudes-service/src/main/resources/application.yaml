server:
  port: ${PORT:8080}
  address: 0.0.0.0
  error:
    include-message: always

# Dirección del microservicio de equipos (en docker-compose es el nombre del servicio)
equipos:
  url: ${EQUIPOS_URL:http://localhost:8081}

spring:
  application:
    name: solicitudes-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:solicitudesdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.web: INFO
